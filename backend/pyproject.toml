[project]
name = "lm-extraction"
version = "1.0.0"
description = "Legal Metrology package extraction pipeline — PackageFactSnapshot v1.1"
requires-python = ">=3.11"

# Base install: the contract, the API and the storage layer.
#
# Deliberately excludes the OCR and CV engines. The domain rules — projection,
# quarantine, fact resolution, normalization — are the part that must be
# correct, and they should be testable on any machine in seconds without
# installing PaddlePaddle. The engines live in extras.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Image quality diagnostics.
cv = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
]

# The primary OCR candidate (§12). Large; install deliberately.
paddle = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
]

# The transparent baseline (§21). Also needs the tesseract binary on PATH.
tesseract = [
    "pytesseract>=0.3.13",
    "pillow>=10.4",
]

# S3-compatible artifact storage.
s3 = [
    "boto3>=1.35",
]

postgres = [
    "psycopg[binary]>=3.2",
]

otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Contract tests are the ones that must never be skipped silently. Marking
# engine-dependent tests lets CI run the contract suite everywhere and the
# engine suite only where the engines are installed.
markers = [
    "needs_cv: requires opencv",
    "needs_ocr: requires a real OCR engine",
]
# Our own deprecation warnings are errors — they are a signal that this code
# is using something on its way out, and a warning nobody reads is not a
# signal. Third-party deprecations are not ours to fix and must not be able to
# break collection: anyio and starlette both emit them from module import, so
# an unscoped `error` filter turns any dependency bump into a red test run
# that says nothing about this codebase.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore:The anyio.abc.*:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = [
    # The domain modules carry long explanatory comments by design.
    "E501",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# The optional engines have no stubs and are imported lazily.
ignore_missing_imports = true
